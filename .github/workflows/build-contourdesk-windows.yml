name: Build ContourDesk Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'ContourDesk/**'
      - '.github/workflows/build-contourdesk-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: ContourDesk
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Test
        working-directory: ContourDesk
        run: python -m pytest -q
      - name: Build portable EXE
        working-directory: ContourDesk
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ContourDesk --collect-all cv2 --collect-all ezdxf --collect-all fitz app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ContourDesk-Windows
          path: ContourDesk/dist/ContourDesk.exe
